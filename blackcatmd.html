<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>錯題本小黑貓 - 答錯的題目排成筆記</title>
<link rel="icon" href="logomain.jpg">
<meta name="description" content="錯題本小黑貓：測驗答錯的題目自動排成筆記紙，可以拖、可以調留白，匯出到 GoodNotes 之後題目還能搬。只有你自己看得到。">

<!-- ★ CSP：第二層防線。這一頁的第一層是「每一個字都跳脫」（題目文字全部走 escapeHTML，
     算式交給 KaTeX 而且 trust:false），沒有任何地方把資料當 HTML 原樣塞進去。
     整頁是單檔內嵌 script，所以 'unsafe-inline' 非開不可，這條擋不住
     被注入的 inline script 本身；它擋的是下一步——載不到外部 script，
     也送不出去任何東西（connect-src 只留 Firebase）。
     ★ img-src 只有 'self'：題目圖只收站上 data/quiz/ 底下的檔案（理由見 qImgSrc）。
       外部網址的圖就算寫進資料也畫不出來，而且匯出時轉圖片會被跨來源擋住。
     改了外部來源要跟著改這裡，也要改 firebase.json。 -->
<meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
    style-src 'self' 'unsafe-inline';
    font-src 'self' data:;
    img-src 'self' data: blob:;
    connect-src 'self' data: https://*.googleapis.com https://*.firebaseio.com https://www.gstatic.com https://apis.google.com https://eeblackcat-c605d.firebaseapp.com;
    frame-src https://eeblackcat-c605d.firebaseapp.com https://accounts.google.com https://apis.google.com;
    worker-src 'self';
    base-uri 'self';
    object-src 'none';
    form-action 'self'">
<!-- ★ 防點擊劫持。理由與完整說明在 publicnew.html 同一段：
     正式站在 GitHub Pages 設不了 HTTP 標頭，而 frame-ancestors 放在
     <meta> 裡規格上無效，所以只剩這一段 JS。三頁各有一份。 -->
<script>
    if (top !== self) {
        document.documentElement.style.display = 'none';
        try { top.location = self.location; } catch (e) {}
    }
</script>

<!-- ★ KaTeX 自己 host（vendor/），理由跟以前的筆記頁一樣：沒有 SRI 的第三方 script
     等於「上游哪天被換掉，我們照跑不誤」。它**不進 sw.js 的 CORE**（js 加字型約 570KB），
     走「同源靜態資源快取優先」那條路，用過一次就留在快取裡。
     沒到 → 算式顯示原文（\( … \) 那一串），不會整頁壞掉。
     ★ html-to-image 與 gnwrite.js（寫 GoodNotes 檔）**按匯出才載**：多數時候用不到。 -->
<link rel="stylesheet" href="vendor/katex.min.css">
<script defer src="vendor/katex.min.js"></script>
<style>
/* ==========================================================
   外殼 token：這一頁**故意不跟另外三個產品共用**

   ★ 跟模擬器一樣**不鋪背景圖**：這是滿版不捲動的工作區，主角是一疊紙。
   ★ 工作台是中性灰，不是站上的暖奶黃：紙的顏色（#fcf9f4）是從真的筆記紙
   量出來的，暖奶黃的桌子配暖白的紙看起來像同一塊布做的兩件衣服；
   中性灰上紙才浮得起來（GoodNotes 那類 App 的桌面一律是中性灰，同一個道理）。
   ★ 所以 `tests/design.mjs` 那條「兩個檔案的 token 必須一致」**不含這一頁**。

   對比（門檻 4.5，量的是最小的那級字 11.5px）：
     淺色 ink-3 對 raised 5.57／對 paper 4.97；accent 對 paper 5.37
     深色 ink-3 對 raised 5.46／對 paper 6.46
   ========================================================== */
:root{
    --paper:#eaeaee; --paper-raised:#f7f7f9; --paper-sunk:#dcdce0;
    --ink:#1c1c1e; --ink-2:#48484a; --ink-3:#63636a;
    --rule:#d3d3d8; --accent:#7a5905; --accent-fill:#7a5905;
    --accent-bright:#8a6605;
    --accent-soft:rgba(0,0,0,.055);
    --ok:#2f7d8c; --bad:#c0392b;
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
    --dur-fast:.09s; --dur-base:.18s;
}
html.dark{
    --paper:#131316; --paper-raised:#232326; --paper-sunk:#0d0d0f;
    --ink:#f2f2f7; --ink-2:#c7c7cc; --ink-3:#98989d;
    --rule:#3a3a3e; --accent:#e8c46a; --accent-fill:#8a6a12;
    --accent-bright:#e8c46a; --accent-soft:rgba(255,255,255,.08);
    --ok:#63b6c4; --bad:#ff8a80;
}

/* ==========================================================
   紙

   ★★ 紙**不跟深色模式變**。匯出到 GoodNotes 的一定是那張淺色的紙，
   畫面上的紙就是匯出的樣子——深色模式下換成深色紙的話，
   使用者看到的跟拿到的是兩個東西（「我排的時候不是這個顏色」）。
   深色模式只把紙外面那片桌子變暗，跟 GoodNotes 深色模式下照樣是白紙一樣。

   ★ 一頁 610×816（CSS px），跟以前的筆記頁同一張貼圖 notepaper.webp（2 倍解析度 1220×1632）：
     頁首 3 格（72px：點線／No.／Date）、線距 24px、最後一條線之後留 1 格。
     匯出時 1px = 0.75pt（96 dpi 換到 72 dpi），一頁是 457.5 × 612 pt，
     跟使用者那本 GoodNotes 筆記（446.9 × 587.5 pt，比例 1.315）差 2.4%，比例相同到小數第二位。
   ⚠️ 線距 24 跟貼圖是綁死的（tools/notepaper.py 照這個重採樣過），改這裡要重產貼圖。
   ========================================================== */
:root{
    --sheet-paper:#fcf9f4; --sheet-rule:#c8c4be; --sheet-ink:#1e1708;
    --sheet-dim:#6b6358;    /* 題目旁的小字（出處、填答格數）：對紙 5.6 */
    --sheet-ans:#8a5a06;    /* 正解：金色，對紙 5.03（以前筆記頁「答案」那個色） */
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);overflow:hidden;
     font:16px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
     -webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button:not(:disabled):active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
    button:not(:disabled):active{transform:none}
}

/* ---- 全螢幕版面：整頁不捲動，捲的是裡面那兩塊 ---- */
#app{height:100dvh;display:flex;flex-direction:column;min-height:0}
header{flex:none;background:var(--paper-raised);padding:0;border-bottom:1px solid var(--rule)}
.hbar{padding:5px 8px;display:flex;align-items:center;gap:6px;min-height:44px}
.hbar-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.tsep{width:1px;height:18px;background:var(--rule);margin:0 4px}

/* ★ 按鈕沒有框：灰工作台上每多一個框就多一條線，而畫面上真正該有線的只有紙。 */
.btn{font-weight:700;border-radius:9px;min-height:32px;padding:0 11px;font-size:14px;
     background:transparent;border:1px solid transparent;cursor:pointer;white-space:nowrap;
     transition:background var(--dur-fast) var(--ease)}
.btn:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:transparent}
/* 整頁唯一一顆實心鈕：匯出。它是這一頁存在的理由，所以只有它長這樣。 */
.btn.primary{background:var(--accent-fill);color:#fff}
.btn.primary:hover{background:var(--accent-fill);filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:rgba(192,57,43,.1)}
.btn.tiny{min-height:28px;padding:0 9px;font-size:13.5px;border-radius:8px}
.btn.icon{min-width:32px;padding:0;font-size:15px;line-height:1}

/* ---- 分段控制：一個凹槽，選中的那一格浮起來 ---- */
.seg{display:flex;gap:2px;padding:2px;background:var(--paper-sunk);border-radius:9px}
.seg button{flex:1;min-height:26px;padding:0 10px;border:0;border-radius:7px;
            background:transparent;font-size:13px;font-weight:700;color:var(--ink-2);
            white-space:nowrap;cursor:pointer;
            transition:background var(--dur-fast) var(--ease)}
.seg button:hover{background:var(--accent-soft)}
.seg button.on{background:var(--paper-raised);color:var(--ink);
               box-shadow:0 1px 2px rgba(0,0,0,.16)}
html.dark .seg button.on{box-shadow:0 1px 2px rgba(0,0,0,.5)}

/* ---- logo 下拉選單（行為與主站一致） ---- */
#logoWrap{position:relative;flex:none}
#logoBtn{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 6px 2px 2px;
         border-radius:10px}
#logoBtn:hover{background:var(--accent-soft)}
#logoBtn img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.htitle{font-weight:900;font-size:16px;line-height:1.15;white-space:nowrap}
.htitle small{display:block;font-weight:600;font-size:11.5px;color:var(--ink-3);letter-spacing:.16em}
#logoChev{font-size:12.5px;line-height:1;opacity:.6;color:var(--ink-3);
          transition:transform var(--dur-base) var(--ease)}
#logoBtn[aria-expanded="true"] #logoChev{transform:rotate(180deg);opacity:1}
#logoMenu{position:absolute;left:0;top:100%;margin-top:8px;z-index:80;
          min-width:232px;border-radius:14px;overflow:hidden;background:var(--paper-raised);
          border:1px solid var(--rule);box-shadow:0 10px 28px rgba(26,24,21,.22)}
#logoMenu.hidden{display:none}
.logo-menu-item{position:relative;
                display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
                width:100%;min-height:50px;padding:9px 15px;font-size:16px;font-weight:700;
                text-align:left;text-decoration:none;color:var(--ink);background:transparent;
                border:none;cursor:pointer}
.logo-menu-item small{font-size:13px;font-weight:600;color:var(--ink-3);margin-top:1px}
.logo-menu-item:hover{background:var(--accent-soft)}
.logo-menu-item + .logo-menu-item{border-top:1px solid var(--rule)}
/* 目前所在的那一項框起來（不寫「（目前所在）」五個字）；讀螢幕的人拿到 aria-current。
   四個檔案要一致，tests/logomenu.mjs 會比對。 */
.logo-menu-item.is-here{cursor:default;outline:2px solid var(--accent-bright);
                        outline-offset:-2px;border-radius:10px}
.logo-menu-item.is-here:hover{background:transparent}
/* beta 徽章：絕對定位貼右緣，不排進 flex 流（直接塞進 flex-column 會自成一列）。
   四個檔案（publicnew／ncue／blackcatmd／blackcatspice）要一致。 */
.logo-menu-item.has-beta{padding-right:74px}
.beta-tag{position:absolute;right:15px;top:50%;transform:translateY(-50%);
          padding:2px 7px;border-radius:999px;
          font-size:11.5px;font-weight:900;letter-spacing:.08em;line-height:1.4;
          text-transform:uppercase;
          color:var(--accent);background:var(--accent-soft);border:1px solid var(--rule)}

/* ---- 工作區 ---- */
#work{flex:1;display:flex;min-height:0}
#listCol{flex:none;width:16rem;min-height:0;display:flex;flex-direction:column;
         border-right:1px solid var(--rule);background:var(--paper-raised)}
#listHead{flex:none;display:flex;align-items:center;gap:6px;padding:8px 8px 0 12px}
#listHead b{font-size:13px;color:var(--ink-3);font-weight:800}
#btnNew{margin-left:auto}
#bookList{flex:1;min-height:0;overflow:auto;padding:8px}
#editCol{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#editHead,#selBar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px 0}
#selBar{padding:6px 10px;margin:8px 10px 0;border-radius:12px;background:var(--paper-raised);
        border:1px solid var(--rule)}
#selBar .lbl{font-size:13px;font-weight:800;color:var(--ink-2);white-space:nowrap}
#selBar .num{font-size:13px;font-weight:800;min-width:3.6em;text-align:center;white-space:nowrap}
/* 標題拿掉框：它是這本的名字，點下去才長出底色、那時它才是輸入框。 */
#bookTitle{flex:1;min-width:8rem;padding:5px 10px;border-radius:9px;
           border:1px solid transparent;background:transparent;font-weight:900;font-size:15px;
           transition:background var(--dur-fast) var(--ease)}
#bookTitle:hover{background:var(--accent-soft)}
#bookTitle:focus{background:var(--paper-raised);border-color:var(--rule)}
#saveState{font-size:13px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.chk{display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;color:var(--ink-2);
     cursor:pointer;white-space:nowrap;padding:0 4px}
.chk input{width:16px;height:16px;accent-color:var(--accent-fill);margin:0}

.bk{position:relative;display:block;width:100%;text-align:left;padding:7px 10px;margin-bottom:2px;
    border-radius:9px;border:0;background:transparent;cursor:pointer;
    transition:background var(--dur-fast) var(--ease)}
.bk:hover,.bk.is-open{background:var(--accent-soft)}
.bk.is-open::before{content:"";position:absolute;left:3px;top:9px;bottom:9px;
                    width:3px;border-radius:2px;background:var(--accent-bright)}
.bk b{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk small{font-size:11.5px;color:var(--ink-3)}
.hint{color:var(--ink-3);font-size:14px;padding:16px 14px;line-height:1.7}
.hint b{color:var(--ink-2)}

/* ---- 一疊紙 ----
   ★ 紙用 transform: scale 縮放，外面包一層撐出縮放後的大小（transform 不佔版面）。
     所以紙裡面的座標永遠是 610×816 的那一套，存檔與匯出都用這一套，跟螢幕多大無關。 */
#sheets{flex:1;min-height:0;overflow:auto;padding:14px 12px 40px;
        display:flex;flex-direction:column;align-items:center;gap:18px;
        -webkit-user-select:none;user-select:none}
.sheet-wrap{flex:none;position:relative}
.sheet-n{position:absolute;left:0;right:0;bottom:-15px;text-align:center;font-size:11px;
         color:var(--ink-3);line-height:1}
.sheet{position:absolute;left:0;top:0;width:610px;height:816px;transform-origin:0 0;
       background-color:var(--sheet-paper);
       /* 上層是真的那張紙（頁首、紙紋），下層從貼圖底下那 23px 的透明尾巴接著畫線。
          下層同時是降級：貼圖沒載到也還是一張有線的紙。 */
       background-image:url(notepaper.webp),
           repeating-linear-gradient(transparent 0 23px, var(--sheet-rule) 23px 24px);
       background-size:610px 816px,auto;background-repeat:no-repeat,repeat;
       border-radius:2px;
       /* ★ 不能 overflow:hidden：拖到別張紙上的那一段路，題目會被自己那張紙切掉、看起來消失了。
            題目的位置本來就夾在紙裡面（放開時 clamp），用不到裁切。 */
       box-shadow:0 1px 3px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.10)}
/* 拖曳中那一題所在的紙整張浮到最上層：每張紙都有 transform，各自是一個疊放層，
   不浮上來的話往下一頁拖時題目會被壓在下一張紙底下。 */
.sheet-wrap.lift{z-index:30}
html.dark .sheet{box-shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4)}
.sheet.drop{outline:3px solid var(--accent-bright);outline-offset:3px}

/* 一題 = 題目框（.it-box，裡面是放大縮小過的 .qbox）＋ 下面的作答空間（.it-gap）。 */
.it{position:absolute;touch-action:pan-x pan-y}
.it.sel{touch-action:none;z-index:5}
.it.dragging{z-index:20;opacity:.92;cursor:grabbing;
             /* 讓「手指底下是哪一張紙」量得到底下那張，而不是拖著的題目自己。 */
             pointer-events:none}
.it-box{position:relative;cursor:grab;border-radius:3px}
.it:hover .it-box{box-shadow:0 0 0 1px rgba(122,89,5,.35)}
.it.sel .it-box{box-shadow:0 0 0 2px var(--accent-bright)}
.it-box > .qbox{transform-origin:0 0}
.it-gap{position:relative;pointer-events:none}
.it.sel .it-gap{border:1.5px dashed rgba(122,89,5,.55);border-top:0;border-radius:0 0 6px 6px;
                background:rgba(232,196,106,.08)}
.it-gap .gap-lbl{position:absolute;left:8px;top:4px;font-size:12px;font-weight:700;color:#8a6a12;display:none}
.it.sel .it-gap .gap-lbl{display:block}
/* 兩個把手：右下角拉大小、作答空間底下拉高度。只在選中的那一題出現。 */
.h-size,.h-gap{position:absolute;display:none;pointer-events:auto;touch-action:none;
               background:var(--accent-fill);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.it.sel .h-size,.it.sel .h-gap{display:block}
.h-size{right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;cursor:nwse-resize}
.h-gap{left:50%;bottom:-8px;width:46px;height:14px;margin-left:-23px;border-radius:8px;cursor:ns-resize}

/* ==========================================================
   題目本身（.qbox）

   ★★ 每一條規則都只掛在 .qbox 底下，不靠祖先：匯出時把它複製一份放到畫面外去轉圖片，
   靠祖先的樣式在複製品身上會全部掉光（症狀是「匯出來的字變成另一個大小」）。
   ★ 底色是紙的顏色、不透明：匯出後題目是一張圖疊在橫線紙上，透明的話線會穿過字。
   ★ 寬 582：框從 x=12 排到 594。紙上的橫線從 13.5 畫到 591.5（量 notepaper.webp），
     框比線頭再往左 1.5px，**線頭與那一欄點整個蓋住**——2026-10-07 使用者看到框左邊露出一小截線頭，
     他那本 PDF 的題目圖也是從線頭左邊一點點開始（8～11pt）。字從 x=14 開始，就是線的起點。
     縮放是外面那層 transform，這裡永遠按 582 排，所以同一題縮成多大，裡面的換行都一樣。
   ========================================================== */
.qbox{width:582px;background:var(--sheet-paper);color:var(--sheet-ink);
      font:14px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
      word-break:break-word;overflow-wrap:anywhere;
      /* 高度由 positionItem 撐到整數格（框上下緣夾在兩條線之間），內容放在那幾格的正中間。 */
      display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.qbox .q-in{padding:5px 6px 6px 2px}  /* 左邊 2px：字從 x=14 開始，就是橫線的起點 */
.qbox .q-stem{display:flex;gap:.45em}
.qbox .q-no{flex:none;font-weight:800}
.qbox .q-txt{flex:1;min-width:0;white-space:pre-wrap}
.qbox .q-tag{font-size:12px;font-weight:800;color:var(--sheet-dim);margin-left:.3em;white-space:nowrap}
.qbox .q-grp{margin:0 0 6px;white-space:pre-wrap}   /* 不畫左邊那條豎線：題目一律從線頭切齊 */
.qbox .q-listen{margin:0 0 6px;font-size:13px;white-space:pre-wrap}
.qbox .q-listen b{color:var(--sheet-dim);font-size:12px}
.qbox .q-img{display:block;max-width:100%;max-height:340px;margin:6px 0 2px;background:#fff}
.qbox .q-opts{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:2px 14px}   /* (A)(B) 跟題號切齊，不縮排 */
.qbox .q-opts.short{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
.qbox .q-opts li{display:flex;gap:.35em;min-width:0}
.qbox .q-opts .q-l{flex:none;font-weight:700}
.qbox .q-opts .q-o{flex:1;min-width:0}
.qbox .q-opts .q-img{max-height:150px}

   所以框頂＝某條線 + 2、框底＝往下某條線 − 1，框高永遠是 24k − 3。
   ⚠️ 改線距或換貼圖要重量這兩個數字：差 1px 的症狀是框邊壓到線上、整頁看起來每一題都「歪一點點」。 */

const BODY_BOTTOM = PAGE_H - LINE;         // 最後一條線（792）

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

/* ---------- 主題：與主站共用同一個鍵 ---------- */
const THEME_KEY = 'eeblackcat-theme';
const SIDE_KEY = 'eeblackcat-wbnote-side';

    document.documentElement.classList.contains('dark') ? 'light' : 'dark');

/* ---------- logo 選單 ----------
   判斷「點外面」時要用 #logoWrap 而不是 #logoBtn，

addEventListener('keydown', e => { if (e.key === 'Escape') { setLogoMenu(false); if (selKey) selectItem(null); } });

/* ---------- Firebase：同一個專案、同一個來源，登入狀態直接沿用 ---------- */
const firebaseConfig = {
    apiKey:"AIzaSyD9uIEAe3InKxHs86QhWHjuMSuimxrhdkQ",
    authDomain:"eeblackcat-c605d.firebaseapp.com",
    projectId:"eeblackcat-c605d",
    storageBucket:"eeblackcat-c605d.firebasestorage.app",
    messagingSenderId:"1012329411307",
    appId:"1:1012329411307:web:63b87debbbc3e4778044ae"
};
const appId = "eeblackcat-c605d";
const P  = n => `artifacts/${appId}/public/data/${n}`;
const PU = n => auth.currentUser && !auth.currentUser.isAnonymous
                ? `artifacts/${appId}/users/${auth.currentUser.uid}/${n}` : null;
/* ★★ 錯題本存在 settings 這個集合裡，一本一份文件（id 是 wbnote_xxx，欄位 kind:'wbnote'）。
   **不新開集合、也不用以前筆記用的 notes**：私人集合有白名單（firestore.rules），
   新的集合要改規則再到主控台推一次，漏推的症狀是「按了沒反應」——而 notes 那一條
   從 2026-08-13 加進去之後有沒有推上去，到 2026-10-07 都還在路線圖的「待你動手」裡。
   settings 是課表、讀書計時都在用的，確定活著。
   ⚠️ 主站「排成錯題本」寫的是同一個地方（publicnew.html 的 WBN_PREFIX），兩邊要一致。 */
const BOOK_COL = 'settings';
const BOOK_KIND = 'wbnote';
const BOOK_PREFIX = 'wbnote_';
const app = initializeApp(firebaseConfig), db = getFirestore(app);
let auth;
/* ★★ 登入狀態只存 localStorage，IndexedDB 完全不進清單（2026-09-24 第三刀）。
   Firebase 開機時會把清單上**每一個**儲存區先測一遍能不能用，全部測完才開始還原登入；
   iPhone 裝成 App、換過兩次頁之後，IndexedDB 有時候**連測試都不回話**，
   於是 `onAuthStateChanged` 從來不觸發，畫面停在「訪客」。
   所以 IndexedDB 整個拿掉，舊登入改由下面這段**自己搬一次**，而且有逾時。
   ⚠️ 搬過就記一個旗子，之後永遠不再讀 IndexedDB（不記的話登出不掉）。
   ⚠️ 四頁（主站、ncue 產生檔、錯題本、模擬器）這段要一致，理由同 v140。 */
/* ★★ iPhone／iPad：換頁時不要把上一頁「凍起來」留著（2026-09-24 第四刀）。
   被凍住的頁還握著它開過的小資料庫，切第二次之後新的那一頁去開資料庫就等不到回應。
   掛一個空的 `unload` 監聽器，Safari 就不會把這一頁放進「上一頁快取」；
   萬一還是被凍了又被叫回來（`pageshow` 的 persisted），就整頁重新載入。
   ⚠️ 只對 iOS 做。⚠️ 四頁都要有。 */
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
    addEventListener('unload', () => {});
    addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
}
const AUTH_LS_KEY = `firebase:authUser:${firebaseConfig.apiKey}:[DEFAULT]`;
const AUTH_MIGRATED = 'eeblackcat-auth-ls';
async function adoptIdbLogin() {
    try {
        if (localStorage.getItem(AUTH_MIGRATED) === '1') return;
        if (localStorage.getItem(AUTH_LS_KEY)) { localStorage.setItem(AUTH_MIGRATED, '1'); return; }
        const read = new Promise((res) => {
            const o = indexedDB.open('firebaseLocalStorageDb');
            o.onerror = () => res(undefined);
            o.onblocked = () => res(undefined);
            o.onupgradeneeded = () => { try { o.transaction.abort(); } catch (e) {} res(null); };
            o.onsuccess = () => {
                try {
                    const r = o.result.transaction('firebaseLocalStorage', 'readonly')
                                .objectStore('firebaseLocalStorage').get(AUTH_LS_KEY);
                    r.onsuccess = () => { res(r.result ? r.result.value : null); o.result.close(); };
                    r.onerror = () => { res(undefined); o.result.close(); };
                } catch (e) { res(null); try { o.result.close(); } catch (e2) {} }
            };
        });
        /* 1.5 秒拿不到就算了：這次先當訪客，下次開站再試。 */
        const v = await Promise.race([read, new Promise(r => setTimeout(() => r(undefined), 1500))]);
        if (v === undefined) return;                 // 逾時或出錯：不記旗子，下次再搬
        if (v) localStorage.setItem(AUTH_LS_KEY, JSON.stringify(v));
        localStorage.setItem(AUTH_MIGRATED, '1');
    } catch (e) { /* localStorage 被關掉之類的：當作沒有舊登入 */ }
}
await adoptIdbLogin();
try { auth = initializeAuth(app, { persistence: [browserLocalPersistence] }); }
catch (e) { auth = getAuth(app); }

onAuthStateChanged(auth, async (user) => {
    const me = (user && !user.isAnonymous) ? user : null;
    if (!me){
        $('whoami').textContent = '訪客';
        stopSubs();
        renderAll();
        return;
    }
    let name = '已登入';
    try {
        const s = await getDoc(doc(db, P('users'), me.uid));
        if (s.exists()) name = s.data().displayName || '無名小貓';
    } catch(e){}
    $('whoami').textContent = name;
    startSubs();
    renderAll();
});

/* ==========================================================
   題目 → HTML

   ★ 這裡收到的題目是主站「排成錯題本」存進來的那一份（publicnew.html 的 wbNoteSnap）：
     { q, options?, optImg?, img?, grp?, listen?, multi?, fill?, from, ans }
     全部是字串或字串陣列，**每一個字都要跳脫**（CLAUDE.md 第四條）——題目來自題庫檔，
     也來自使用者自己出的題，而自己出的題可以寫任何東西。
   ★ 算式的寫法跟主站一樣只認 \( … \)（行內）與 \[ … \]（獨立一行），不認 $ … $：
     題目裡會出現「$100」這種價錢（理由寫在主站 3.7 那一節）。
   ========================================================== */
function mathHTML(str) {
    const s = String(str ?? '');
    if (!s) return '';
    const re = /\\\(([\s\S]*?)\\\)|\\\[([\s\S]*?)\\\]/g;
    let out = '', last = 0, m;
    while ((m = re.exec(s)) !== null) {
        out += escapeHTML(s.slice(last, m.index));
        const disp = m[2] !== undefined;
        out += `<span class="qtex" data-tex="${escapeHTML(disp ? m[2] : m[1])}"${disp ? ' data-disp="1"' : ''}>${escapeHTML(m[0])}</span>`;
        last = m.index + m[0].length;
    }
    return last ? out + escapeHTML(s.slice(last)) : escapeHTML(s);
}
/* 把一塊裡還沒排的算式交給 KaTeX。沒載到就先留原文，載到了再回來排（defer 的 script）。
   ★ throwOnError: true ＋ 吃掉錯誤＝排不出來就留原文，不印 KaTeX 那個紅字。 */
function renderMath(root) {
    const K = window.katex;
    const jobs = root.querySelectorAll('.qtex:not([data-done])');
    if (!jobs.length) return;
    if (!K) return;
    jobs.forEach(el => {
        try {
            K.render(el.dataset.tex, el, { displayMode: el.dataset.disp === '1', throwOnError: true, trust: false, strict: 'ignore' });
            el.dataset.done = '1';
        } catch (e) { el.classList.add('q-tex-raw'); el.dataset.done = '1'; }
    });
}
/* 題目圖只收站上 data/quiz/ 底下的相對路徑（跟主站 quizImgSrc 同一條規則，再嚴一點）。
   ★ 外部網址一律不收：CSP 本來就擋，而且匯出轉圖片時跨來源的圖會整張空白。
   ★ `cab:`（檔案櫃那一種）不收：題目圖本來就不該是它（主站 questionImgHTML 那段）。
   ⚠️ 擋 `..`，不然它可以指到網站上任何一個檔案。 */
function qImgSrc(src) {
    const s = String(src || '').trim();
    if (/^[\w.\-]+(\/[\w.\-]+)*$/.test(s) && !s.split('/').includes('..')) return 'data/quiz/' + s;
    return '';
}
function imgsHTML(list) {
    return (Array.isArray(list) ? list : []).map(im => {
        const url = qImgSrc(im && im.src);
        return url ? `<img class="q-img" src="${escapeHTML(url)}" alt="${escapeHTML((im && im.alt) || '')}">` : '';
    }).join('');
}
/* 選項短的（每一個都不超過 14 個字、沒有圖、沒有獨立一行的算式）就橫排，像考卷那樣；
   長的一個一行。 */
function optsShort(s) {
    const opts = s.options || [];
    if (opts.length < 2) return false;
    const hasImg = s.optImg && Object.keys(s.optImg).some(k => Array.isArray(s.optImg[k]) && s.optImg[k].length);
    if (hasImg) return false;
    return opts.every(o => { const t = String(o ?? ''); return !/\\\[/.test(t) && t.replace(/\\\(|\\\)/g, '').length <= 14; });
}
function qHTML(item, no, withAns) {
    const s = item.s || {};
    let h = '';
    const g = s.grp;
    if (g && (g.text || (g.img && g.img.length))) h += `<div class="q-grp">${mathHTML(g.text)}${imgsHTML(g.img)}</div>`;
    if (s.listen) h += `<div class="q-listen"><b>聽力題・逐字稿</b><br>${mathHTML(s.listen)}</div>`;
    const tags = [s.multi ? '複選' : '', s.fill ? `填答 ${Number(s.fill) || ''} 格` : ''].filter(Boolean)
        .map(t => `<span class="q-tag">（${escapeHTML(t)}）</span>`).join('');
    h += `<div class="q-stem"><span class="q-no">${no}.</span><span class="q-txt">${mathHTML(s.q)}${tags}</span></div>`;
    h += imgsHTML(s.img);
    const opts = Array.isArray(s.options) ? s.options : [];
    if (opts.length) {
        h += `<ol class="q-opts${optsShort(s) ? ' short' : ''}">` + opts.map((o, i) =>
            `<li><span class="q-l">(${LETTERS[i] || i + 1})</span><span class="q-o">${mathHTML(o)}${imgsHTML(s.optImg && s.optImg[String(i)])}</span></li>`).join('') + '</ol>';
    }
    const ans = withAns && s.ans ? `<span class="q-ans">${mathHTML(s.ans)}</span>` : '';
    const src = s.from ? `<span class="q-src">${escapeHTML(s.from)}</span>` : '';
    if (ans || src) h += `<div class="q-foot">${ans}${src}</div>`;
    /* ★ 外層 .qbox 的高度會被撐到整數格（positionItem），量高度量的是裡面的 .q-in——
         量外層的話「撐出來的高度」又被當成內容高度，下一次再往上取一格，一路長下去。 */
    return `<div class="qbox"><div class="q-in">${h}</div></div>`;
}

/* ==========================================================
   一本的資料形狀

   { kind:'wbnote', title, flow, density, ans, pages, items:[…], createdAt, updatedAt }
   一題：{ k, s:{題目}, sc, gap, page, x, y }
     k     題目的身分（主站 wbKeyOf：同一題收兩次不會變兩題）
     sc    縮放（0.5–1，1 = 頁寬）
     gap   作答空間幾行；null = 跟著「留白」自動
     page/x/y  位置（CSS px，紙的左上角是 0,0）。主站剛加進來的題目沒有位置。
   ★★ flow（自動排版）：true 的時候位置全部照題號重算——改留白、改大小、拿掉一題，
     後面的題目會自己往前補。**一拖就變 false**：拖過的人就是要自己擺，
     不能下一次改留白時把他擺好的位置全部洗掉。「重新自動排版」把它改回 true。
   ========================================================== */
const curBook = () => books.find(b => b.id === curId) || null;
function kindOf(s) {
    if (s && s.fill) return 'fill';
    if (s && Array.isArray(s.options) && s.options.length) return 'choice';
    return 'calc';
}
function gapOf(book, it) {
    if (Number.isFinite(it.gap)) return clamp(Math.round(it.gap), 0, GAP_MAX);
    const d = DENSITY[book.density] || DENSITY.mid;
    return d[kindOf(it.s)];
}
const scOf = (it) => clamp(Number(it.sc) || 1, SC_MIN, SC_MAX);
const placed = (it) => Number.isFinite(it.page) && Number.isFinite(it.x) && Number.isFinite(it.y);
/* 內容高度 h → 題目框的高度：往上取到整格（24k − 3，理由見 LINE_TOP 那一段）。 */
const snapBoxH = (h) => Math.max(1, Math.ceil((h + LINE_TOP + LINE_BOT) / LINE)) * LINE - LINE_TOP - LINE_BOT;
/* 框頂對齊到格子上（某條線 + 2）。 */
const snapTop = (y) => Math.round((y - LINE_TOP) / LINE) * LINE + LINE_TOP;
/* 一頁最高放得下的框：從 BODY_TOP 到最後一條線上面 1px。 */
const BOX_MAX = BODY_BOTTOM - LINE_BOT - BODY_TOP;
/* 內容縮放後的高度（還沒量到就先當 3 行，量到了會重排一次）。
   ★ 比一頁還高的題目自動縮到放得下（不然它永遠排不進任何一頁）。 */
function rawH(it) {
    const h = natH.get(it.k) || LINE * 3;
    return h * effSc(it);
}
function effSc(it) {
    const h = natH.get(it.k) || LINE * 3;
    return Math.min(scOf(it), BOX_MAX / h);
}
/* 一題的題目框實際的高度（已經對齊到格子）。 */
function boxH(it) { return snapBoxH(rawH(it)); }
/* 這一題底下那條線：框底 + 1。作答空間從這條線往下數 gap 格。 */
const lineBelow = (it) => Math.ceil((it.y + boxH(it) + LINE_BOT) / LINE) * LINE;

/* 照題號從頭排。
   ★ 每一題的框頂在一條線下面 2px、框底在一條線上面 1px（佔滿整數格），
     作答空間是框底那條線往下數整數格，下一題從作答空間最後一條線底下開始——跟手寫筆記一樣。
   ★ 這一題連同它的作答空間放不下就換下一頁：題目在這頁底、空間在下一頁，等於沒有空間。
     只有「整頁空白還是放不下」的時候才硬放（作答空間被頁底截掉）。 */
function placeAt(book, it, page, y) {
    it.page = page; it.x = MARGIN_X; it.y = y;
    /* 下一題的頂端：這一題底下那條線 + 作答空間 + 2。 */
    return y + boxH(it) + LINE_BOT + gapOf(book, it) * LINE + LINE_TOP;
}
const fitsFrom = (book, it, y) => y + boxH(it) + LINE_BOT + gapOf(book, it) * LINE <= BODY_BOTTOM;
function flowLayout(book) {
    let page = 0, y = BODY_TOP;
    for (const it of book.items) {
        if (y > BODY_TOP && !fitsFrom(book, it, y)) { page++; y = BODY_TOP; }
        y = placeAt(book, it, page, y);
        if (y + LINE > BODY_BOTTOM) { page++; y = BODY_TOP; }
    }
}
/* 自己擺的本子裡，新加進來的題目（主站剛排進來、還沒有位置的）接在最後面。 */
function placeLoose(book) {
    let page = 0, y = BODY_TOP;
    for (const it of book.items) if (placed(it)) {
        const next = lineBelow(it) + gapOf(book, it) * LINE + LINE_TOP;
        if (it.page > page || (it.page === page && next > y)) { page = it.page; y = next; }
    }
    for (const it of book.items) if (!placed(it)) {
        if (y > BODY_TOP && !fitsFrom(book, it, y)) { page++; y = BODY_TOP; }
        y = placeAt(book, it, page, y);
    }
}
function pageCount(book) {
    let n = Math.max(1, Number(book.pages) || 1);
    for (const it of book.items) if (placed(it)) n = Math.max(n, it.page + 1);
    return n;
}
function layout(book) {
    if (book.flow) flowLayout(book); else placeLoose(book);
    if (book.flow) book.pages = pageCount({ ...book, pages: 1 });
}

/* ==========================================================
   雲端：訂閱、合併、存檔
   ========================================================== */
function normBook(id, d) {
    const items = (Array.isArray(d.items) ? d.items : []).filter(it => it && it.k && it.s)
        .map(it => ({ k: String(it.k), s: it.s, sc: Number(it.sc) || 1,
                      gap: Number.isFinite(it.gap) ? it.gap : null,
                      page: Number.isFinite(it.page) ? it.page : undefined,
                      x: Number.isFinite(it.x) ? it.x : undefined,
                      y: Number.isFinite(it.y) ? it.y : undefined }));
    return { id, title: String(d.title || '錯題本'), flow: d.flow !== false, density: DENSITY[d.density] ? d.density : 'mid',
             ans: !!d.ans, pages: Number(d.pages) || 1, items,
             createdAt: Number(d.createdAt) || Date.now(), updatedAt: Number(d.updatedAt) || 0 };
}
function startSubs() {
    stopSubs();
    const path = PU(BOOK_COL);
    if (!path) return;
    unsub = onSnapshot(query(collection(db, path), where('kind', '==', BOOK_KIND)), (snap) => {
        const seen = new Set();
        const hadCur = !!curBook();
        let curChanged = false;
        snap.forEach(ds => {
            seen.add(ds.id);
            readyIds.add(ds.id);
            const remote = normBook(ds.id, ds.data());
            const i = books.findIndex(b => b.id === ds.id);
            if (i < 0) { books.push(remote); return; }
            const local = books[i];
            if (ds.id === curId && dirty) {
                /* ★ 這一本正在改、還沒存回去：不整本蓋掉（會把剛拖好的位置洗回去），
                     只把雲端多出來的題目（主站另一個分頁剛排進來的）接到後面。 */
                const have = new Set(local.items.map(it => it.k));
                for (const it of remote.items) if (!have.has(it.k) && !removedKeys.has(it.k)) {
                    local.items.push({ ...it, page: undefined, x: undefined, y: undefined });
                    curChanged = true;
                }
                return;
            }
            /* 自己剛寫上去的那一份回來了（updatedAt 一樣），不必重畫。 */
            if (remote.updatedAt === local.updatedAt && remote.items.length === local.items.length) return;
            books[i] = remote;
            if (ds.id === curId) curChanged = true;
        });
        /* 雲端已經沒有的（別的分頁刪掉了），本機也拿掉；本機剛開、還沒寫上去的留著。 */
        books = books.filter(b => seen.has(b.id) || b._local);
        const first = !booksLoaded;
        booksLoaded = true;
        if (!openedFromUrl) {
            openedFromUrl = true;
            const want = new URLSearchParams(location.search).get('nb');
            if (want && books.some(b => b.id === want)) { openBook(want); return; }
        }
        /* ★ 別本的快照（或自己存檔的回音）不重畫這一本：重畫會把題目的 HTML 全部重做一次，
             KaTeX 很貴，而且正在拖的那一題會被抽走。 */
        if (first || curChanged || (hadCur && !curBook())) renderAll(); else renderList();
    }, (err) => {
        console.warn('錯題本讀不到:', err && (err.code || err));
        booksLoaded = true;
        showToast('錯題本讀不到，等一下再重新整理一次');
        renderAll();
    });
}
function stopSubs() {
    flushSave();
    if (unsub) { unsub(); unsub = null; }
    books = []; booksLoaded = false; curId = null; selKey = null;
    /* ★ 登出要清掉：留著的話，下一個人登入的空窗裡任何一次存檔都會寫到**他的**路徑下，
         而內容是上一個人的（以前筆記頁 mdReadyIds 同一個理由）。 */
    readyIds.clear(); removedKeys.clear(); natH.clear();
}
function payloadOf(b) {
    /* ★ 一律走 JSON 來回一次：Firestore 不收 undefined（整份寫入會失敗），
         而還沒有位置的題目正是 undefined。 */
    const items = JSON.parse(JSON.stringify(b.items.map(it => ({ k: it.k, s: it.s, sc: scOf(it),
        gap: Number.isFinite(it.gap) ? it.gap : null, page: it.page, x: it.x, y: it.y }))));
    return { kind: BOOK_KIND, title: b.title, flow: !!b.flow, density: b.density, ans: !!b.ans,
             pages: pageCount(b), items, createdAt: b.createdAt, updatedAt: b.updatedAt };
}
function scheduleSave() {
    const b = curBook();
    if (!b) return;
    dirty = true;
    $('saveState').textContent = '還沒存…';
    clearTimeout(saveTimer);
    /* 停 0.8 秒才寫：Firestore 免費額度算的是次數，拖一題就寫一次的話一晚上就是幾百次。 */
    saveTimer = setTimeout(() => saveBook(b.id), 800);
}
function flushSave() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; if (dirty && curId) saveBook(curId); }
}
async function saveBook(id) {
    saveTimer = null;
    const b = books.find(x => x.id === id);
    const path = PU(BOOK_COL);
    if (!b || !path) return;
    if (!readyIds.has(id) && !b._local) {
        /* 看得見的「存檔失敗」比安靜地寫成空的好。 */
        $('saveState').textContent = '雲端還沒讀到，先不存';
        return;
    }
    b.updatedAt = Date.now();
    const payload = payloadOf(b);
    if (new TextEncoder().encode(JSON.stringify(payload)).length > BOOK_BYTES_MAX) {
        $('saveState').textContent = '這本太大了，存不進去';
        showToast('這本錯題本太大了，拿掉幾題或分成兩本再存');
        return;
    }
    try {
        await setDoc(doc(db, path, id), payload);
        if (id === curId) { dirty = false; $('saveState').textContent = '已存'; }
        delete b._local;
        readyIds.add(id);
    } catch (err) {
        console.warn('錯題本存檔失敗:', err && (err.code || err));
        if (id === curId) $('saveState').textContent = '沒存起來';
        showToast('沒存起來，等一下再試一次');
    }
}
function newBookId() { return BOOK_PREFIX + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function newBook() {
    if (!PU(BOOK_COL)) return showToast('先登入才能開錯題本');
    if (!booksLoaded) return showToast('還在讀你的錯題本，等一下');
    const now = Date.now();
    const b = { id: newBookId(), title: '新的錯題本', flow: true, density: 'mid', ans: false, pages: 1, items: [],
                createdAt: now, updatedAt: now, _local: true };
    books.push(b);
    readyIds.add(b.id);
    openBook(b.id);
    scheduleSave();
    setTimeout(() => { $('bookTitle').focus(); $('bookTitle').select(); }, 30);
}
async function deleteBook() {
    const b = curBook();
    if (!b) return;
    /* 按兩下才刪（第一下按鈕變成「再按一次刪除」，3 秒內有效）。
       ★ 不用瀏覽器的 confirm()：iPad 裝成 App 時那個視窗有時候整頁卡住。 */
    if (Date.now() - deleteArmed > 3000) {
        deleteArmed = Date.now();
        $('btnDelete').textContent = '再按一次刪除';
        setTimeout(() => { if (Date.now() - deleteArmed >= 3000) $('btnDelete').textContent = '刪除這本'; }, 3100);
        return;
    }
    deleteArmed = 0;
    $('btnDelete').textContent = '刪除這本';
    clearTimeout(saveTimer); saveTimer = null; dirty = false;
    const path = PU(BOOK_COL);
    books = books.filter(x => x.id !== b.id);
    curId = null; selKey = null;
    renderAll();
    if (!path || (b._local && !readyIds.has(b.id))) return;
    try { await deleteDoc(doc(db, path, b.id)); showToast(`刪掉「${b.title}」了`); }
    catch (e) { showToast('沒刪成功，等一下再試一次'); }
}

/* ==========================================================
   畫面
   ========================================================== */
function renderAll() {
    const inUse = !!(auth && auth.currentUser && !auth.currentUser.isAnonymous);
    const b = inUse ? curBook() : null;
    $('loginHint').classList.toggle('hidden', inUse);
    $('emptyHint').classList.toggle('hidden', !inUse || !!b || !booksLoaded);
    $('editHead').classList.toggle('hidden', !b);
    $('sheets').classList.toggle('hidden', !b);
    $('btnNew').disabled = !inUse;
    renderList();
    if (b) renderBook(); else { $('sheets').innerHTML = ''; itemEls.clear(); $('selBar').classList.add('hidden'); }
}
function renderList() {
    const box = $('bookList');
    const inUse = !!(auth && auth.currentUser && !auth.currentUser.isAnonymous);
    if (!inUse) { box.innerHTML = '<div class="hint">登入後這裡會列出你的錯題本。</div>'; return; }
    if (!booksLoaded) { box.innerHTML = '<div class="hint">讀取中…</div>'; return; }
    const list = [...books].sort((a, c) => (c.updatedAt || 0) - (a.updatedAt || 0));
    if (!list.length) { box.innerHTML = '<div class="hint">還沒有錯題本。做完測驗在結算頁按「排成錯題本」，或按上面「＋ 新的一本」。</div>'; return; }
    box.innerHTML = list.map(b => {
        const d = new Date(b.updatedAt || b.createdAt || Date.now());
        return `<button class="bk${b.id === curId ? ' is-open' : ''}" data-id="${escapeHTML(b.id)}">
            <b>${escapeHTML(b.title)}</b><small>${b.items.length} 題・${d.getMonth() + 1}/${d.getDate()}</small></button>`;
    }).join('');
}
$('bookList').addEventListener('click', (e) => {
    const b = e.target.closest('.bk');
    if (b) openBook(b.dataset.id);
});
function openBook(id) {
    if (curId !== id) { flushSave(); dirty = false; selKey = null; removedKeys.clear(); }
    curId = id;
    document.body.classList.remove('phone-list');
    document.body.classList.add('phone-edit');
    $('saveState').textContent = '';
    renderAll();
    $('sheets').scrollTop = 0;
}

/* 整本重畫：題目 HTML 只在這裡產生一次（KaTeX 很貴），之後拖、改留白只改位置。 */
function renderBook() {
    const b = curBook();
    if (!b) return;
    if (document.activeElement !== $('bookTitle')) $('bookTitle').value = b.title;
    document.querySelectorAll('#densitySeg button').forEach(x => x.classList.toggle('on', x.dataset.density === b.density));
    $('ansChk').checked = !!b.ans;
    $('btnFlow').textContent = b.flow ? '自動排版中' : '重新自動排版';
    $('btnFlow').disabled = !!b.flow;
    $('btnAddPage').classList.toggle('hidden', !!b.flow);
    $('btnExport').disabled = !b.items.length;

    const box = $('sheets');
    /* ★ 重畫前記住捲到哪裡：清空的那一瞬間內容高度是 0，捲動位置會被夾回最上面，
         於是「勾一下附正解」整疊紙就跳回第一頁。 */
    const keepScroll = box.scrollTop;
    if (drag) { drag.el.style.transform = ''; drag = null; }
    if (ro) ro.disconnect();
    itemEls.clear();
    box.innerHTML = '';
    if (!b.items.length) {

}
const canvasPng = (c) => new Promise((res) => c.toBlob(b => res(b), 'image/png'));
const canvasJpeg = (c, q) => new Promise((res) => c.toBlob(b => res(b), 'image/jpeg', q));
const bytesOf = async (blob) => new Uint8Array(await blob.arrayBuffer());
/* 一題 → PNG。★ 拍的是畫面外的一份複製品（寬 582、不縮放），不是紙上那一題：
   紙上那一題被 transform 縮過，而且外面還有選取框。 */
async function questionPng(H, qbox, R) {
    const holder = $('snap');
    const cl = qbox.cloneNode(true);
    cl.style.transform = '';
    holder.appendChild(cl);
    try {
        await Promise.all([...cl.querySelectorAll('img')].map(i => (i.decode ? i.decode().catch(() => {}) : 0)));
        const opt = { pixelRatio: R, backgroundColor: '#fcf9f4', includeStyleProperties: SNAP_STYLE_PROPS() };
        opt.fontEmbedCSS = await katexFontCSS(cl);
        const svgUrl = await H.toSvg(cl, opt);
        const loadImg = () => new Promise((res, rej) => {
            const im = new Image();
            im.onload = () => res(im); im.onerror = () => rej(new Error('SVG 載不進來'));
            im.src = svgUrl;
        });
        let img = await loadImg();
        /* ⚠️ Safari（含 iPad 上所有瀏覽器）第一張常常字型還沒嵌好：先畫一次暖身，再開一張新的畫。 */
        if (isWebKit()) {
            const warm = document.createElement('canvas'); warm.width = warm.height = 8;
            warm.getContext('2d').drawImage(img, 0, 0, 8, 8);
            await new Promise(r => setTimeout(r, 30));
            img = await loadImg();
        }
        const w = cl.offsetWidth, h = cl.offsetHeight;
        const c = document.createElement('canvas');
        c.width = Math.ceil(w * R); c.height = Math.ceil(h * R);
        const cx = c.getContext('2d');
        cx.fillStyle = '#fcf9f4'; cx.fillRect(0, 0, c.width, c.height);
        cx.drawImage(img, 0, 0, c.width, c.height);
        return { png: await bytesOf(await canvasPng(c)), w, h };
    } finally { cl.remove(); }
}
/* 紙：notepaper.webp 畫到一張 1220×1632 的畫布上，底下先鋪紙色與橫線
   （貼圖最下面 23px 是透明的尾巴，畫面上靠 CSS 的漸層接線，這裡自己畫）。 */
async function paperPdf(G) {
    const c = document.createElement('canvas');
    c.width = 1220; c.height = 1632;
    const cx = c.getContext('2d');
    cx.fillStyle = '#fcf9f4'; cx.fillRect(0, 0, c.width, c.height);
    cx.fillStyle = '#c8c4be';
    for (let y = 23; y < PAGE_H; y += LINE) cx.fillRect(0, y * 2, c.width, 2);
    try {
        const im = new Image();
        im.src = 'notepaper.webp';
        await im.decode();
        cx.fillStyle = '#fcf9f4'; cx.fillRect(0, 0, c.width, c.height);
        cx.fillStyle = '#c8c4be';
        for (let y = 23; y < PAGE_H; y += LINE) cx.fillRect(0, y * 2, c.width, 2);
        cx.drawImage(im, 0, 0, c.width, c.height);
    } catch (e) { /* 貼圖沒到：只有線的紙，照樣能用 */ }
    const jpg = await bytesOf(await canvasJpeg(c, 0.86));
    return G.paperPdfFromJpeg(jpg, c.width, c.height, PAGE_W * PT_PER_PX, PAGE_H * PT_PER_PX);
}
function busy(on, text, sub) {
    $('busy').classList.toggle('hidden', !on);
    if (text) $('busyText').textContent = text;
    $('busySub').textContent = sub || '';
}
function fileNameOf(b) { return (String(b.title || '錯題本').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || '錯題本') + '.goodnotes'; }
async function exportGoodnotes() {
    const b = curBook();
    if (!b || exporting) return;
    if (!b.items.length) return showToast('這本還沒有題目');
    exporting = true;
    selectItem(null);
    busy(true, '匯出中…', '準備工具');
    try {
        const [okH, okG] = await Promise.all([
            loadScript('vendor/html-to-image.min.js', () => window.htmlToImage),
            loadScript('vendor/gnwrite.js', () => window.GnWrite)
        ]);
        if (!okH || !okG) throw new Error('匯出工具載不到（網路斷了？）');
        const H = window.htmlToImage, G = window.GnWrite;
        try { await document.fonts.ready; } catch (e) {}
        layout(b); placeSheets(b);
        const n = pageCount(b);
        const pages = Array.from({ length: n }, () => ({ images: [] }));
        /* 解析度：一題寬 582px × 3 ≈ 1746 像素。GoodNotes 裡放大到兩倍還是清楚的字，
           而 30 題的檔案大約 2–4 MB。 */
        const R = 3;
        for (let i = 0; i < b.items.length; i++) {
            const it = b.items[i];
            busy(true, '匯出中…', `題目轉成圖片 ${i + 1} / ${b.items.length}`);
            const el = itemEls.get(it.k);
            if (!el) continue;
            const { png } = await questionPng(H, el.querySelector('.qbox'), R);
            const s = effSc(it);
            /* 高度用對齊過的框高（不是圖量出來的整數像素），框上下緣才會剛好夾在兩條線之間。 */
            pages[clamp(it.page | 0, 0, n - 1)].images.push({
                x: it.x * PT_PER_PX, y: it.y * PT_PER_PX,
                w: BASE_W * s * PT_PER_PX, h: boxH(it) * PT_PER_PX, data: png
            });
        }
        busy(true, '匯出中…', '打包成 GoodNotes 筆記本');
        const paper = await paperPdf(G);
        const bytes = await G.write({ title: b.title, pageW: PAGE_W * PT_PER_PX, pageH: PAGE_H * PT_PER_PX, paperPdf: paper, pages });
        busy(false);
        await deliver(new File([bytes], fileNameOf(b), { type: 'application/octet-stream' }));
    } catch (err) {
        console.warn('匯出失敗:', err);
        busy(false);
        showToast('匯出失敗：' + ((err && err.message) || '不知道為什麼') + '，再試一次');
    } finally {
        exporting = false;
    }
}
/* iPhone／iPad：跳出分享選單（可以直接選 GoodNotes）；其他裝置：下載。
   ★ 分享選單被取消（使用者按了關閉）不算失敗，不要再下載一次。 */
async function deliver(file) {
    if (deliverSink) return deliverSink(file);
    const touch = navigator.maxTouchPoints > 1 && /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent);
    if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: file.name }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    showToast('下載好了：用 GoodNotes 打開這個檔案，題目可以直接拖');
}
$('btnExport').onclick = exportGoodnotes;

/* ★ 手機切到別的 App 走的是 visibilitychange，不是 beforeunload——
   只綁後者的話，手機使用者每次切走都會掉最後 0.8 秒的改動。 */
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSave();
});
addEventListener('beforeunload', flushSave);
/* KaTeX 是 defer 載的：它比第一次畫晚到的話，載到之後把已經畫好的題目補排一次。 */
addEventListener('load', () => { for (const el of itemEls.values()) renderMath(el); });

/* 測試用的掛勾：tests 與無頭瀏覽器檢查拿它直接塞一本進來看排版（不碰雲端）。
   ★ 只在網址帶 ?wbtest=1 時才有，正式使用者不會碰到。 */
if (new URLSearchParams(location.search).get('wbtest') === '1') {
    window.__wb = {
        load(book) {
            const b = normBook(book.id || 'wbnote_test', book);
            b._local = true;
            books = [b]; booksLoaded = true; readyIds.add(b.id);
            curId = b.id;
            document.body.classList.remove('phone-list'); document.body.classList.add('phone-edit');
            renderBook();
            ['loginHint', 'emptyHint'].forEach(id => $(id).classList.add('hidden'));
            $('editHead').classList.remove('hidden'); $('sheets').classList.remove('hidden');
            return b;
        },
        book: () => curBook(),
        state: () => ({ zoom, selKey, pages: curBook() ? pageCount(curBook()) : 0 }),
        relayout() { const b = curBook(); layout(b); placeSheets(b); },
        /* 匯出但不下載：把檔案的位元組交回來（給檢查程式拿去用 gnnote 讀回）。 */
        async exportBytes() {
            let got = null;
            deliverSink = (f) => { got = f; };
            try { await exportGoodnotes(); } finally { deliverSink = null; }
            return got ? Array.from(new Uint8Array(await got.arrayBuffer())) : null;
        }
    };
}

renderAll();

/* Service Worker：跟其他頁共用同一支。
   ★ 上面有 await（搬舊登入），load 可能已經發過了，所以先看 readyState。 */
if ('serviceWorker' in navigator) {
    const reg = () => navigator.serviceWorker.register('sw.js').catch(() => {});
    if (document.readyState === 'complete') reg(); else addEventListener('load', reg, { once: true });
}
</script>
