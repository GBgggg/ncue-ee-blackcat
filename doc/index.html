  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- Clickjacking guard: only 小黑貓's own blackcatdoc.html (same origin) may frame this page.
       Reading top.location.origin throws for a cross-origin parent, which also hides the page. -->
  <script>
    (function () {
      if (top === self) return;
      var ok = false;
      try { ok = top.location.origin === location.origin; } catch (e) {}
      if (!ok) {
        document.documentElement.style.display = 'none';
        try { top.location = self.location; } catch (e) {}
      }
    })();
  </script>
  
<script type="module">

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
